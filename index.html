
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGME Student Evaluation Portal</title>

<style>
:root{
  --green:#087f6b;
  --dark:#103f35;
  --text:#193d33;
  --muted:#71857e;
  --border:#dce9e2;
  --sage:#e7f3ec;
  --sage-light:#f7fbf8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f8f7;
  color:var(--text);
  font-family:Arial,sans-serif;
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--dark);
  color:white;
  padding:26px 15px;
}
.brand{
  font-size:25px;
  font-weight:800;
  margin:5px 10px 35px;
}
.brand small{
  display:block;
  font-size:12px;
  font-weight:400;
  color:#b5d8ca;
  margin-top:8px;
}
.nav{
  width:100%;
  display:block;
  padding:15px;
  border:0;
  border-radius:10px;
  margin-bottom:7px;
  background:transparent;
  color:white;
  text-align:left;
  cursor:pointer;
  font-size:14px;
}
.nav:hover,.nav.active{background:#286b5c}
.sidebar-note{
  font-size:11px;
  color:#bdd6cd;
  margin:40px 10px;
  line-height:1.7;
}
main{
  flex:1;
  min-width:0;
  padding:28px;
  max-width:1650px;
}
h1{font-size:27px;margin:7px 0}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:15px;margin:0 0 10px}
p{line-height:1.6}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:15px;
}
.eyebrow{
  font-size:11px;
  letter-spacing:1.3px;
  font-weight:bold;
  color:#638579;
}
.muted{font-size:13px;color:var(--muted)}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 3px 12px #123d3010;
}
.grid,.fields,.management-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin:12px 0 6px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #cbdcd4;
  border-radius:9px;
  font:inherit;
  color:var(--text);
  background:white;
}
input:focus,select:focus,textarea:focus{
  outline:2px solid #9ed9c8;
  outline-offset:1px;
}
input[type=checkbox]{
  width:18px;
  height:18px;
  accent-color:var(--green);
  cursor:pointer;
}
textarea{min-height:85px}
.btn{
  border:0;
  border-radius:9px;
  background:var(--green);
  color:white;
  padding:12px 17px;
  font-weight:600;
  cursor:pointer;
  margin:8px 5px 8px 0;
}
.btn:hover{background:#086453}
.btn.secondary{background:#e5f0eb;color:#145846}
.btn.danger{background:#fbe9e6;color:#a33126}
.btn.small{padding:7px 10px;font-size:12px}
.btn.full{width:100%}
.pill{
  display:inline-block;
  padding:7px 12px;
  background:#e1f2ea;
  color:#176452;
  border-radius:25px;
  font-size:12px;
  font-weight:600;
}
.notice{
  padding:14px;
  background:#fff6df;
  color:#775e24;
  border-radius:10px;
  font-size:13px;
  margin-bottom:18px;
}
.metric{
  font-size:29px;
  font-weight:800;
  margin-top:8px;
}
.tool-card{
  padding:23px;
  border:1px solid #d8e8e1;
  background:#f1f8f5;
  border-radius:12px;
  font-weight:700;
  color:var(--dark);
  cursor:pointer;
  text-align:left;
}
.tool-card:hover{background:#dcefe8}
.tablewrap{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:12px;
  border-bottom:1px solid #e8efeb;
  text-align:left;
  vertical-align:top;
}
th{background:#f4f9f6;color:#426e61}
.checks{
  max-height:240px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:10px;
}
.check-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:0;
  border-bottom:1px solid #edf2ef;
  cursor:pointer;
  font-weight:400;
}
.check-row:hover{background:#e5f3e9}
.check-row strong{display:block;font-size:14px}
.check-row small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}

/* LIGHT GREEN SECTION STYLING */

#assignForm{
  background:var(--sage-light);
  border:1px solid #e0eee5;
  border-radius:14px;
  padding:22px;
}
.section-label{
  background:var(--sage);
  color:#176452;
  padding:12px 16px;
  border-left:4px solid #4b9b7c;
  border-radius:8px;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:700;
  margin:24px 0 18px;
}
#targetArea .checks{
  background:#f2f9f4;
  border:1px solid #d7e9dd;
  border-radius:12px;
}
#targetArea .check-row{background:#f2f9f4}
#targetArea .check-row:hover{background:#e5f3e9}

/* STUDENT SELECTION PANELS */

.student-panels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:16px;
}
.student-panel{
  border:1px solid #d5e7dc;
  border-radius:13px;
  overflow:hidden;
  background:white;
  min-width:0;
}
.student-panel-head{
  padding:16px;
  background:#eaf5ee;
  border-bottom:1px solid #d5e7dc;
}
.student-panel-head h3{margin:0 0 6px}
.student-panel-body{
  height:350px;
  overflow-y:auto;
}
.student-toolbar{
  padding:12px 15px;
  border-bottom:1px solid var(--border);
}
.student-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-bottom:1px solid #edf2ef;
  cursor:pointer;
  margin:0;
  font-weight:400;
}
.student-row:hover{background:#f0f8f2}
.student-row.selected{
  background:#e4f3e9;
  border-left:3px solid #4b9b7c;
}
.avatar{
  width:39px;
  height:39px;
  border-radius:50%;
  background:#dcefe7;
  color:#176452;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  flex-shrink:0;
}
.student-details{flex:1;min-width:0}
.student-details strong{
  display:block;
  font-size:13px;
}
.student-details small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}
.selected-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.empty-state{
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
  font-size:13px;
}
.assignment-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
  padding-top:16px;
  margin-top:18px;
}
.summary{
  background:#f1f8f5;
  border-radius:12px;
  padding:18px;
}
.summary-line{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  font-size:13px;
}
.rating-row{
  padding:16px 0;
  border-bottom:1px solid #e9f0eb;
}
.rating-options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.rating-option{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px;
  border:1px solid var(--border);
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:400;
  margin:0;
}
.rating-option input{width:auto}
@media(max-width:1050px){
  .student-panels{grid-template-columns:1fr}
}
@media(max-width:750px){
  body{display:block}
  .sidebar{width:100%}
  main{padding:16px}
  .header{display:block}
  .student-panel-body{height:270px}
  #assignForm{padding:14px}
}
</style>
</head>

<body>
<aside class="sidebar">
  <div class="brand">
    UGME <span style="color:#8ddbc7">Portal</span>
    <small>Student Evaluation Management</small>
  </div>
  <button class="nav active" data-page="student"> Student Portal</button>
  <button class="nav" data-page="department"> Department Admin</button>
  <button class="nav" data-page="technical"> UGME Technical Admin</button>
  <div class="sidebar-note">
    PROTOTYPE ONLY<br>
    Fictional records and browser-local data.<br>
    No secure authentication or role restrictions.
  </div>
</aside>

<main>
  <div class="header">
    <div>
      <div class="eyebrow">OFFICE OF UNDERGRADUATE MEDICAL EDUCATION</div>
      <h1 id="heading">Student Dashboard</h1>
      <p class="muted" id="subtitle">UGME Student Evaluation Portal</p>
    </div>
    <span class="pill">Prototype · 2026–27</span>
  </div>
  <div id="content"></div>
</main>

<script>
"use strict";

const KEY="ugme_demo_v3";
const YEARS=["Year 3","Year 4","Year 5"];

const TYPES={
  faculty:"Faculty Evaluation by Students",
  rotation:"End of Rotation Evaluation",
  teaching:"End of Teaching Activity Evaluation",
  cbil:"CBIL Evaluation"
};

const ROTATIONS={
  "Year 3":[
    "General Surgery","ENT","Eye","Family Medicine",
    "General Medicine","MNCH"
  ],
  "Year 4":[
    "Anaesthesia","Dermatology","Endocrinology",
    "Hospital Paediatrics",
    "Hospital Paediatrics (General Inpatient - verify name)",
    "Hospital Paediatrics (General Outpatient - verify name)",
    "Infectious Diseases and Microbiology",
    "Neonatology","Obstetric and Gynaecology",
    "Paediatric Neurology","Psychiatry","Pulmonology",
    "Selective & Electives","Specialty Surgery"
  ],
  "Year 5":[
    "Breast Surgery","Electives","Family Medicine",
    "General Surgery","Medicine","Urology"
  ]
};

const FORMS={
  faculty:{
    values:[2,3,4,5,6],
    scale:["Poor","Fair","Good","Very Good","Excellent"],
    sections:[{
      title:"Faculty Evaluation",
      questions:[
        "Facilitates learning",
        "Provides useful feedback",
        "Engages students as part of the health care team",
        "Holds students accountable",
        "Demonstrates professionalism",
        "Is an effective role model",
        "Overall effectiveness as a teacher"
      ]
    }],
    comments:["Additional Comments"]
  },
  rotation:{
    values:[1,2,3,4,5],
    scale:["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"],
    sections:[
      {title:"Students' Perception of Learning",questions:[
        "The objectives of the rotation are well-defined",
        "My tasks are relevant to the learning objectives",
        "Small group learning activities meet their objectives",
        "I am encouraged to participate in meaningful tasks",
        "My tasks are suitably challenging",
        "My problem-solving skills are developing well",
        "I can put theoretical knowledge into practice"
      ]},
      {title:"Students' Perception of Teachers / Facilitators",questions:[
        "I know whom to contact as rotation coordinator",
        "Faculty are well prepared for teaching sessions",
        "Faculty are approachable and provide useful feedback"
      ]},
      {title:"Perception of Admin Staff",questions:[
        "Administrative staff communicate effectively",
        "Administrative staff coordinate the rotation well"
      ]},
      {title:"Perception of Learning Environment",questions:[
        "There is sufficient physical space for students",
        "There are adequate opportunities to interact with patients",
        "I feel included in the clinical team",
        "The rotation stimulates me to learn further"
      ]}
    ],
    comments:["Strengths of this rotation","Suggestions for improvement"]
  },
  teaching:{
    values:[1,2,3],
    scale:["Unsatisfactory","Satisfactory","Excellent"],
    sections:[{
      title:"Teaching Activity Evaluation",
      questions:[
        "Overall rating of the session",
        "Ability of the facilitator to engage the class",
        "Ability of the facilitator to effectively deliver the content",
        "If applicable, appropriate pre-reading material was provided"
      ]
    }],
    comments:["Suggestions for improvement"]
  },
  cbil:{
    values:[1,2,3,4,5,6,7],
    scale:["Unsatisfactory","Fair","Satisfactory","Good","Very Good","Excellent","Outstanding"],
    sections:[
      {title:"Evaluation of Facilitator",questions:[
        "Promotes an environment conducive to learning",
        "Helps students manage group function",
        "Gives constructive feedback to students",
        "Assists group in identifying misconceptions or learning deficiencies",
        "Rate the overall facilitation skills"
      ]},
      {title:"Evaluation of Learning Resources",questions:[
        "If applicable, appropriate pre-reading material was provided",
        "Pre/Post tests were relevant in clarifying my concepts"
      ]}
    ],
    comments:["Any other comments"]
  }
};

const DEFAULTS={
  rotations:ROTATIONS,
  forms:FORMS,
  students:[
    {id:"DEMO001",name:"Student A",email:"",year:"Year 3"},
    {id:"DEMO002",name:"Student B",email:"",year:"Year 3"},
    {id:"DEMO003",name:"Student C",email:"",year:"Year 4"},
    {id:"DEMO004",name:"Student D",email:"",year:"Year 5"}
  ],
  faculty:[
    {id:"F001",name:"Faculty Member A",department:"General Medicine",
      mappings:[{year:"Year 3",rotation:"General Medicine"}]},
    {id:"F002",name:"Faculty Member B",department:"General Surgery",
      mappings:[
        {year:"Year 3",rotation:"General Surgery"},
        {year:"Year 5",rotation:"General Surgery"}
      ]},
    {id:"F003",name:"Faculty Member C",department:"Family Medicine",
      mappings:[
        {year:"Year 3",rotation:"Family Medicine"},
        {year:"Year 5",rotation:"Family Medicine"}
      ]}
  ],
  admins:[],
  assignments:[],
  responses:[]
};

let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}

let db=structuredClone(DEFAULTS);
for(const key of Object.keys(DEFAULTS)){
  if(saved[key]!==undefined && typeof saved[key]===typeof DEFAULTS[key]){
    db[key]=saved[key];
  }
}

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>crypto.randomUUID();

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function options(items,selected=""){
  return items.map(x=>`<option value="${esc(x)}" ${x===selected?"selected":""}>${esc(x)}</option>`).join("");
}
function card(html){return `<section class="card">${html}</section>`}
function stat(label,value){
  return card(`<div class="muted">${esc(label)}</div><div class="metric">${value}</div>`);
}
function back(){
  return `<button class="btn secondary" onclick="render('technical')">← Back to Technical Admin</button>`;
}
function completed(a){
  return db.responses.some(r=>r.assignmentId===a.id);
}
function mapped(f,year,rotation){
  return (f.mappings||[]).some(m=>m.year===year&&m.rotation===rotation);
}
function table(headers,rows){
  return `<div class="tablewrap"><table><thead><tr>
    ${headers.map(h=>`<th>${esc(h)}</th>`).join("")}
    </tr></thead><tbody>
    ${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join(""):
    `<tr><td colspan="${headers.length}">No records yet.</td></tr>`}
    </tbody></table></div>`;
}
function initials(name){
  return String(name).split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
}
function downloadCSV(filename,rows){
  const text=rows.map(row=>row.map(v=>
    `"${String(v??"").replace(/"/g,'""')}"`
  ).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");
  a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function parseCSV(text){
  const rows=[];let row=[],field="",quoted=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(quoted&&text[i+1]==='"'){field+='"';i++}
      else quoted=!quoted;
    }else if(c===","&&!quoted){
      row.push(field.trim());field="";
    }else if((c==="\r"||c==="\n")&&!quoted){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(field.trim());
      if(row.some(Boolean))rows.push(row);
      row=[];field="";
    }else field+=c;
  }
  if(quoted)throw Error("Unclosed CSV quote");
  row.push(field.trim());
  if(row.some(Boolean))rows.push(row);
  return rows;
}

let currentStudent="DEMO001";

function render(page="student"){
  document.querySelectorAll(".nav").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page)
  );
  const headings={
    student:"Student Dashboard",
    department:"Department Admin",
    technical:"UGME Technical Admin",
    students:"Student Management",
    faculty:"Faculty Directory",
    rotations:"Rotation Management",
    forms:"Evaluation Form Builder",
    admins:"Admin Management",
    reports:"Evaluation Reports"
  };
  $("heading").textContent=headings[page]||"UGME Portal";
  $("subtitle").textContent="UGME Student Evaluation Portal";
  const pages={
    student:renderStudent,
    department:renderDepartment,
    technical:renderTechnical,
    students:renderStudents,
    faculty:renderFaculty,
    rotations:renderRotations,
    forms:renderForms,
    admins:renderAdmins,
    reports:renderReports
  };
  if(pages[page])pages[page]();
}

/* STUDENT PORTAL */

function renderStudent(){
  const student=db.students.find(s=>s.id===currentStudent)||db.students[0];
  if(!student){
    $("content").innerHTML=card("No students available.");
    return;
  }
  currentStudent=student.id;
  const assignments=db.assignments.filter(a=>a.studentId===student.id);
  const complete=assignments.filter(completed).length;

  $("content").innerHTML=`
    <div class="notice">Demo student selector only. Scholar ID login is not implemented.</div>
    ${card(`
      <h2>My Evaluations</h2>
      <label>Select Demo Student</label>
      <select id="studentSelect">
        ${db.students.map(s=>`<option value="${esc(s.id)}" ${s.id===student.id?"selected":""}>${esc(s.name)} — ${esc(s.year)}</option>`).join("")}
      </select>
      <p class="muted">Student ID: ${esc(student.id)} · ${esc(student.year)}</p>
    `)}
    <div class="grid">
      ${stat("Assigned Evaluations",assignments.length)}
      ${stat("Completed",complete)}
      ${stat("Pending",assignments.length-complete)}
    </div>
    ${assignments.length?assignments.map(a=>card(`
      <h3>${esc(TYPES[a.type])}</h3>
      <p class="muted">${esc(a.rotation)} · ${esc(a.facultyName||a.activity||"")}</p>
      ${completed(a)?`<span class="pill">Completed</span>`:
      `<button class="btn" data-open="${esc(a.id)}">Start Evaluation</button>`}
    `)).join(""):card(`<p class="muted">No evaluations assigned yet.</p>`)}
  `;

  $("studentSelect").onchange=e=>{
    currentStudent=e.target.value;
    renderStudent();
  };
  document.querySelectorAll("[data-open]").forEach(b=>
    b.onclick=()=>openEvaluation(b.dataset.open)
  );
}

/* UGME TECHNICAL ADMIN */

function renderTechnical(){
  $("content").innerHTML=`
    <div class="grid">
      ${stat("Students",db.students.length)}
      ${stat("Faculty",db.faculty.length)}
      ${stat("Assignments",db.assignments.length)}
      ${stat("Completed",db.assignments.filter(completed).length)}
    </div>
    ${card(`
      <h2>Management Tools</h2>
      <div class="management-grid">
        <button class="tool-card" onclick="render('students')">Student Management</button>
        <button class="tool-card" onclick="render('faculty')">Faculty Directory</button>
        <button class="tool-card" onclick="render('rotations')">Rotation Management</button>
        <button class="tool-card" onclick="render('forms')">Evaluation Form Builder</button>
        <button class="tool-card" onclick="render('admins')">Admin Management</button>
        <button class="tool-card" onclick="render('reports')">Evaluation Reports</button>
      </div>
    `)}
  `;
}

/* STUDENT MANAGEMENT */

function renderStudents(){
  $("content").innerHTML=back()+card(`
    <h2>Add Student</h2>
    <form id="studentForm">
      <div class="fields">
        <div><label>Student Name</label><input name="name" required></div>
        <div><label>Student ID</label><input name="id" required></div>
        <div><label>Email</label><input name="email" type="email"></div>
        <div><label>Academic Year</label><select name="year">${options(YEARS)}</select></div>
      </div>
      <button class="btn">Add Student</button>
    </form>
  `)+card(`
    <h2>Bulk Import Students</h2>
    <p class="muted">CSV columns: Name, Student ID, Email, Academic Year.</p>
    <button class="btn secondary" id="template">Download Sample CSV</button>
    <input type="file" id="csvFile" accept=".csv">
    <button class="btn" id="importCSV">Import Students</button>
  `)+card(`
    <h2>Student Directory</h2>
    ${table(["Student Name","Student ID","Email","Year","Action"],
      db.students.map(s=>[
        esc(s.name),esc(s.id),esc(s.email||"—"),esc(s.year),
        `<button class="btn danger small" data-delete-student="${esc(s.id)}">Remove</button>`
      ])
    )}
  `);

  $("studentForm").onsubmit=e=>{
    e.preventDefault();
    const d=new FormData(e.target);
    const id=String(d.get("id")).trim();
    if(db.students.some(s=>s.id===id))return alert("Student ID already exists.");
    db.students.push({
      id,
      name:String(d.get("name")).trim(),
      email:String(d.get("email")).trim(),
      year:d.get("year")
    });
    save();renderStudents();
  };

  $("template").onclick=()=>downloadCSV("student-template.csv",[
    ["Name","Student ID","Email","Academic Year"],
    ["Demo Student E","DEMO005","demo@example.org","Year 3"]
  ]);

  $("importCSV").onclick=async()=>{
    const file=$("csvFile").files[0];
    if(!file)return alert("Choose a CSV file.");
    try{
      const rows=parseCSV(await file.text());
      const expected=["name","student id","email","academic year"];
      if(!rows.length||rows[0].map(x=>x.toLowerCase()).join("|")!==expected.join("|")){
        throw Error("Incorrect CSV headings.");
      }
      const ids=new Set(db.students.map(s=>s.id));
      const incoming=[];
      for(const [i,r] of rows.slice(1).entries()){
        if(r.length!==4||!r[0]||!r[1]||!YEARS.includes(r[3])||ids.has(r[1])){
          throw Error("Invalid or duplicate row "+(i+2));
        }
        ids.add(r[1]);
        incoming.push({name:r[0],id:r[1],email:r[2],year:r[3]});
      }
      db.students.push(...incoming);
      save();
      alert(incoming.length+" students imported.");
      renderStudents();
    }catch(err){
      alert("Import failed: "+err.message);
    }
  };

  document.querySelectorAll("[data-delete-student]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.deleteStudent;
    if(db.assignments.some(a=>a.studentId===id)){
      return alert("Student has evaluation assignments.");
    }
    if(!confirm("Remove this demo student?"))return;
    db.students=db.students.filter(s=>s.id!==id);
    save();renderStudents();
  });
}

  $("studentSearch").oninput=refreshStudents;

    const d=new FormData(e.target);

    const type=d.get("type");
    const rotationNo=String(d.get("rotationNo")||"");
    const startDate=String(d.get("startDate")||"");
    const endDate=String(d.get("endDate")||"");
    const activity=String(d.get("activity")||"").trim();

    if(!selected.size)return alert("Please select at least one student.");
    if(!rotation)return alert("Please select a rotation.");

    if(startDate&&endDate&&endDate<startDate){
      return alert("Rotation end date cannot be earlier than start date.");
    }

    const facultyIds=type==="faculty"?
      [...document.querySelectorAll(".facultyCheck:checked")].map(b=>b.value):
      [null];

    if(!facultyIds.length){
      return alert("Please select at least one faculty member.");
    }

    const count=selected.size*facultyIds.length;
    if(!confirm(
      `Please review:\n\nAcademic Year: ${year}\nRotation: ${rotation}\nStudents: ${selected.size}\nFaculty/Targets: ${facultyIds.length}\nTotal Evaluations: ${count}\n\nContinue?`
    ))return;

    let added=0;

    for(const studentId of selected){
      for(const facultyId of facultyIds){
        const faculty=facultyId?
          db.faculty.find(f=>f.id===facultyId):null;

        if(type==="faculty"&&(!faculty||!mapped(faculty,year,rotation))){
          continue;
        }

        const duplicate=db.assignments.some(a=>
          a.studentId===studentId&&
          a.year===year&&
          a.rotation===rotation&&
          a.rotationNo===rotationNo&&
          a.type===type&&
          (type==="faculty"?
            a.facultyId===facultyId:
            type==="rotation"||a.activity===activity)
        );

        if(duplicate)continue;

        db.assignments.push({
          id:uid(),
          studentId,
          year,
          rotation,
          rotationNo,
          type,
          facultyId:facultyId||"",
          facultyName:faculty?.name||"",
          activity,
          startDate,
          endDate
        });
        added++;
      }
    }

    save();
    alert(`${added} evaluation assignments created.\nDuplicates were skipped.`);
    renderDepartment();
  };

  refreshRotations();
  refreshStudents();
}

        <div class="section-label">${esc(section.title)}</div>

          return `<div class="rating-row">
            <label>${index+1}. ${esc(q)}</label>
            <div class="rating-options">
              ${form.values.map((v,i)=>`
                <label class="rating-option">

      `).join("")}

      <button class="btn">Submit Evaluation</button>

  $("evaluationForm").onsubmit=e=>{
    e.preventDefault();
    if(completed(a))return alert("Already submitted.");

    const d=new FormData(e.target);
    db.responses.push({
      assignmentId:a.id,
      studentId:a.studentId,
      year:a.year,
      rotation:a.rotation,
      type:a.type,
      facultyId:a.facultyId,
      facultyName:a.facultyName,
      activity:a.activity,
      questions,
      ratings:questions.map((_,i)=>Number(d.get("q"+i))),
      comments:form.comments.map((label,i)=>({
        label,
        text:String(d.get("comment"+i)||"")
      })),
      date:new Date().toISOString()
    });

    save();

      <div class="fields">
        <div><label>Academic Year</label><select id="reportYear">
          <option value="">All Years</option>${options(YEARS)}
        </select></div>
        <div><label>Evaluation Form</label><select id="reportType">
          <option value="">All Forms</option>
          ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}
        </select></div>
        <div><label>Rotation</label><select id="reportRotation"></select></div>
        <div><label>Status</label><select id="reportStatus">
          <option value="">All Statuses</option>
          <option value="Completed">Completed</option>
          <option value="Pending">Pending</option>
        </select></div>
      </div>
    `)}
    <div class="grid" id="reportStats"></div>
    ${card(`
      <h2>Completion Report</h2>
      <button class="btn" id="exportCompletion">Export Completion CSV</button>
      <div id="completionTable"></div>
    `)}
    ${card(`
      <h2>Detailed Evaluation Responses</h2>
      <button class="btn" id="exportResponses">Export Detailed Responses CSV</button>
      <div id="responsesTable"></div>
    `)}
    ${card(`
      <h2>Summary Report</h2>
      <button class="btn" id="exportSummary">Export Summary CSV</button>
      <div id="summaryTable"></div>
    `)}
  `;

  let filteredAssignments=[],filteredResponses=[],summaryRows=[];

  function refreshRotations(){
    const year=$("reportYear").value;
    const rotations=year?db.rotations[year]:
      [...new Set(YEARS.flatMap(y=>db.rotations[y]))].sort();
    $("reportRotation").innerHTML=
      `<option value="">All Rotations</option>`+options(rotations);
  }

  function refresh(){
    const year=$("reportYear").value;
    const type=$("reportType").value;
    const rotation=$("reportRotation").value;
    const status=$("reportStatus").value;

    filteredAssignments=db.assignments.filter(a=>
      (!year||a.year===year)&&
      (!type||a.type===type)&&
      (!rotation||a.rotation===rotation)&&
      (!status||(completed(a)?"Completed":"Pending")===status)
    );

    const ids=new Set(filteredAssignments.map(a=>a.id));
    filteredResponses=db.responses.filter(r=>ids.has(r.assignmentId));

    $("reportStats").innerHTML=
      stat("Assigned",filteredAssignments.length)+
      stat("Completed",filteredAssignments.filter(completed).length)+
      stat("Pending",filteredAssignments.filter(a=>!completed(a)).length);

    $("completionTable").innerHTML=table(
      ["Student ID","Year","Rotation","Form","Faculty / Activity","Status"],
      filteredAssignments.map(a=>[
        esc(a.studentId),
        esc(a.year),
        esc(a.rotation),
        esc(TYPES[a.type]),
        esc(a.facultyName||a.activity||"—"),
        completed(a)?"Completed":"Pending"
      ])
    );

    $("responsesTable").innerHTML=table(
      ["Form","Year","Rotation","Faculty / Activity","Ratings","Comments"],
      filteredResponses.map(r=>[
        esc(TYPES[r.type]),
        esc(r.year),
        esc(r.rotation),
        esc(r.facultyName||r.activity||"—"),
        esc(r.ratings.join(", ")),
        esc(r.comments.map(c=>c.text).filter(Boolean).join(" | "))
      ])
    );

    const groups=new Map();

    for(const r of filteredResponses){
      const key=[r.type,r.year,r.rotation,r.facultyId||r.facultyName||r.activity||""].join("||");
      if(!groups.has(key)){
        groups.set(key,{
          type:r.type,
          year:r.year,
          rotation:r.rotation,
          target:r.facultyName||r.activity||"—",
          count:0,
          ratings:[]
        });
      }
      const g=groups.get(key);
      g.count++;
      g.ratings.push(...r.ratings.filter(Number.isFinite));
    }

    summaryRows=[...groups.values()].map(g=>({
      ...g,
      mean:g.ratings.length?
        (g.ratings.reduce((a,b)=>a+b,0)/g.ratings.length).toFixed(2):""
    }));

    $("summaryTable").innerHTML=table(
      ["Form","Year","Rotation","Faculty / Activity","Responses","Mean Rating"],
      summaryRows.map(g=>[
        esc(TYPES[g.type]),
        esc(g.year),
        esc(g.rotation),
        esc(g.target),
        g.count,
        esc(g.mean)
      ])
    );
  }

  $("reportYear").onchange=()=>{
    refreshRotations();
    refresh();
  };
  $("reportType").onchange=refresh;
  $("reportRotation").onchange=refresh;
  $("reportStatus").onchange=refresh;

  $("exportCompletion").onclick=()=>downloadCSV("ugme-completion.csv",[
    ["Student ID","Year","Rotation","Form","Faculty / Activity","Status"],
    ...filteredAssignments.map(a=>[
      a.studentId,a.year,a.rotation,TYPES[a.type],
      a.facultyName||a.activity||"",
      completed(a)?"Completed":"Pending"
    ])
  ]);

  $("exportResponses").onclick=()=>{
    const rows=[[
      "Student ID","Year","Rotation","Form","Faculty","Activity",
      "Question","Rating","Comment Field","Comment","Submitted At"
    ]];

    for(const r of filteredResponses){
      r.questions.forEach((q,i)=>rows.push([
        r.studentId,r.year,r.rotation,TYPES[r.type],
        r.facultyName,r.activity,q,r.ratings[i],"","",r.date
      ]));
      r.comments.forEach(c=>rows.push([
        r.studentId,r.year,r.rotation,TYPES[r.type],
        r.facultyName,r.activity,"","",c.label,c.text,r.date
      ]));
    }
    downloadCSV("ugme-detailed-responses.csv",rows);
  };

  $("exportSummary").onclick=()=>downloadCSV("ugme-summary.csv",[
    ["Form","Year","Rotation","Faculty / Activity","Response Count","Mean Rating"],
    ...summaryRows.map(g=>[
      TYPES[g.type],g.year,g.rotation,g.target,g.count,g.mean
    ])
  ]);

  refreshRotations();
  refresh();
}

/* START PORTAL */

document.querySelectorAll(".nav").forEach(b=>{
  b.addEventListener("click",()=>render(b.dataset.page));
});

render("student");
</script>
</body>
</html>
